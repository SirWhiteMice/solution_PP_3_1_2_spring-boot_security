<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>My page</title></head>
<body>
<h2>My page</h2>
<p>ID: <span th:text="${user.id}"></span></p>
<p>Name: <span th:text="${user.name}"></span></p>
<p>Age: <span th:text="${user.age}"></span></p>
<p>Email: <span th:text="${user.email}"></span></p>
<p>Roles: <span th:each="role : ${user.roles}" th:text="${role.name + ' '}"></span></p>
<a th:if="${isAdmin}" th:href="@{/admin}">Admin page</a>
<form th:action="@{/logout}" method="post"><button type="submit">Logout</button></form>
</body>
</html>
