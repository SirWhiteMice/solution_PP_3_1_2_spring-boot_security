<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>All Users</title>
</head>
<body>
<h2>Users List</h2>
<table border="1" cellpadding="5">
  <tr>
    <th>ID</th>
    <th>First name</th>
    <th>Last name</th>
    <th>Age</th>
    <th>Email</th>
    <th>Roles</th>
    <th>Actions</th>
  </tr>
  <tr th:each="user : ${users}">
    <td th:text="${user.id}"></td>
    <td th:text="${user.firstName}"></td>
    <td th:text="${user.lastName}"></td>
    <td th:text="${user.age}"></td>
    <td th:text="${user.email}"></td>
    <td><span th:each="role : ${user.roles}" th:text="${role.name + ' '}"></span></td>
    <td>
      <form th:action="@{/admin/edit}" method="get" style="display:inline;">
        <input type="hidden" name="id" th:value="${user.id}"/>
        <button type="submit">Edit</button>
      </form>
      <form th:action="@{/admin/delete}" method="post" style="display:inline;">
        <input type="hidden" name="id" th:value="${user.id}"/>
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
</table>
<br>
<form th:action="@{/admin/new}" method="get">
  <button type="submit">Add new user</button>
</form>
<a th:href="@{/user}">My page</a>
<form th:action="@{/logout}" method="post"><button type="submit">Logout</button></form>
</body>
</html>
